<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainBoost Explorer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08091a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08091a;
  --surface:rgba(255,255,255,0.06);
  --surface2:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.1);
  --accent:#7c6fff;
  --accent2:#38d9f5;
  --green:#34d399;
  --red:#f87171;
  --text:#e8eaf6;
  --muted:rgba(255,255,255,0.42);
  --r:16px;
  --blur:blur(20px);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.65}

/* BG */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 55% at 8% 0%,rgba(90,55,210,0.32) 0%,transparent 60%),
    radial-gradient(ellipse 55% 45% at 92% 18%,rgba(25,175,230,0.18) 0%,transparent 55%),
    radial-gradient(ellipse 65% 65% at 48% 105%,rgba(55,15,130,0.38) 0%,transparent 60%),
    #08091a;
}
.stars{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.65) 0%,transparent 100%),
    radial-gradient(1px 1px at 23% 38%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 38% 8%,rgba(255,255,255,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 68%,rgba(255,255,255,.35) 0%,transparent 100%),
    radial-gradient(1px 1px at 72% 22%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 83% 52%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 91% 78%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 4% 83%,rgba(255,255,255,.45) 0%,transparent 100%),
    radial-gradient(1px 1px at 47% 93%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 16% 57%,rgba(200,180,255,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 63% 42%,rgba(140,220,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 29% 72%,rgba(255,255,255,.32) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 77% 88%,rgba(180,160,255,.38) 0%,transparent 100%);
  animation:twinkle 7s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
.orb{position:absolute;border-radius:50%;filter:blur(65px);opacity:0;animation:floatOrb var(--d,15s) ease-in-out infinite var(--dl,0s)}
.orb1{width:520px;height:520px;background:rgba(95,70,255,.2);top:-130px;left:-160px;--d:19s;--dl:0s;--tx:45px;--ty:-35px}
.orb2{width:360px;height:360px;background:rgba(25,195,245,.17);top:28%;right:-90px;--d:15s;--dl:-5s;--tx:-55px;--ty:65px}
.orb3{width:430px;height:430px;background:rgba(170,55,255,.13);bottom:-90px;left:22%;--d:21s;--dl:-9s;--tx:35px;--ty:-55px}
.orb4{width:260px;height:260px;background:rgba(50,225,195,.11);top:58%;left:8%;--d:13s;--dl:-3s;--tx:65px;--ty:35px}
@keyframes floatOrb{
  0%{opacity:0;transform:translate(0,0) scale(1)}15%{opacity:1}
  50%{transform:translate(var(--tx),var(--ty)) scale(1.08)}85%{opacity:1}
  100%{opacity:0;transform:translate(0,0) scale(1)}
}

/* LAYOUT */
.page{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 20px 80px}

/* HEADER */
header{text-align:center;padding:68px 20px 36px;animation:fadeDown .75s ease both}
header h1{
  font-family:'Syne',sans-serif;font-size:clamp(34px,6vw,58px);font-weight:800;
  background:linear-gradient(140deg,#d0c8ff 0%,var(--accent2) 55%,#a78bfa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-1.5px;line-height:1.08;margin-bottom:10px;
}
header p{color:var(--muted);font-size:15px;letter-spacing:.2px}

/* SEARCH */
.search-wrap{animation:fadeUp .75s .12s ease both}
.search-box{
  display:flex;gap:10px;flex-wrap:wrap;
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);padding:14px;border-radius:var(--r);
}
input{
  flex:1;min-width:0;padding:12px 16px;border-radius:12px;border:1px solid var(--border);
  font-family:'DM Sans',sans-serif;font-size:15px;
  background:rgba(255,255,255,0.07);color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,111,255,.18)}

/* BUTTONS */
.btn{
  padding:12px 18px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;
  font-weight:600;font-size:14px;cursor:pointer;
  transition:transform .15s,box-shadow .15s,background .15s,opacity .15s;
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),#5a60ff);color:#fff;box-shadow:0 4px 20px rgba(124,111,255,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 7px 26px rgba(124,111,255,.55)}
.btn-ghost{background:rgba(255,255,255,.09);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.btn-green{background:linear-gradient(135deg,#059669,#34d399);color:#fff;box-shadow:0 4px 18px rgba(52,211,153,.35)}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 7px 24px rgba(52,211,153,.5)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* RECENT */
.recent{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;animation:fadeUp .5s .2s ease both}
.recent-chip{
  padding:6px 13px;border-radius:999px;font-size:12px;font-weight:500;
  background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--muted);
  cursor:pointer;transition:all .18s;
}
.recent-chip:hover{background:rgba(124,111,255,.18);border-color:rgba(124,111,255,.35);color:var(--text)}

/* LOADING */
#loading{display:none;text-align:center;padding:44px 20px;color:var(--muted)}
.spinner{
  display:inline-block;width:34px;height:34px;
  border:3px solid rgba(124,111,255,.18);border-top-color:var(--accent);
  border-radius:50%;animation:spin .75s linear infinite;margin-bottom:14px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARD */
.card{
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--r);padding:28px;margin-top:20px;
  animation:fadeUp .45s ease both;
}
.card-title{
  font-family:'Syne',sans-serif;font-size:clamp(20px,3.5vw,27px);font-weight:700;
  color:#fff;margin-bottom:16px;line-height:1.2;
}

/* IMAGE — FIXED: no crop, full image, centred */
#image{margin-bottom:16px;text-align:center}
#image img{
  max-width:100%;
  width:auto;
  height:auto;
  max-height:420px;
  border-radius:12px;
  display:inline-block;
  object-fit:contain;
}

#overview{
  font-size:15px;color:rgba(255,255,255,.78);line-height:1.78;
  max-height:240px;overflow-y:auto;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:var(--accent) transparent;
}
#overview::-webkit-scrollbar{width:3px}
#overview::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
.card-actions{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* RELATED */
.section-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:11px}
#related{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;
  background:rgba(124,111,255,.11);border:1px solid rgba(124,111,255,.22);
  color:#c4b8ff;cursor:pointer;transition:all .18s;
}
.chip:hover{background:rgba(124,111,255,.26);transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,111,255,.22)}

/* QUIZ */
#quizView{display:none}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.quiz-label{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:#fff}
.quiz-progress-text{font-size:13px;color:var(--muted)}
.progress-bar{height:4px;background:rgba(255,255,255,.1);border-radius:4px;margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .4s ease}
.question-text{font-size:15px;color:rgba(255,255,255,.88);margin-bottom:20px;line-height:1.65;font-style:italic;padding:12px 14px;background:rgba(255,255,255,.05);border-radius:10px;border-left:3px solid var(--accent)}
.question-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent2);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.options{display:flex;flex-direction:column;gap:10px}
.option{
  padding:15px 18px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:14px;text-align:left;cursor:pointer;line-height:1.55;
  transition:all .18s;display:flex;align-items:flex-start;gap:12px;
}
.option:hover:not(:disabled){background:rgba(124,111,255,.15);border-color:rgba(124,111,255,.4);transform:translateX(3px)}
.option.correct{background:rgba(52,211,153,.15)!important;border-color:var(--green)!important;color:var(--green)!important}
.option.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
.option:disabled{cursor:default}
.option-letter{
  display:inline-flex;width:24px;height:24px;min-width:24px;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;
}
.next-wrap{margin-top:22px;text-align:right}

/* SCORE */
#scoreView{display:none}
.score-hero{text-align:center;padding:30px 0 24px}
.score-emoji{font-size:56px;margin-bottom:12px;display:block}
.score-number{
  font-family:'Syne',sans-serif;font-size:clamp(48px,9vw,72px);font-weight:800;
  background:linear-gradient(135deg,#d0c8ff,var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;
}
.score-label{color:var(--muted);font-size:15px;margin-top:8px}
.score-message{font-size:17px;color:rgba(255,255,255,.85);margin:18px 0;font-family:'DM Sans',sans-serif}
.score-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.breakdown{margin-top:22px}
.breakdown-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;line-height:1.5}
.breakdown-item:last-child{border-bottom:none}
.bi-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.bi-text{color:rgba(255,255,255,.65)}

/* QUIZ LOADING */
#quizLoading{display:none;text-align:center;padding:44px 20px;color:var(--muted)}

footer{text-align:center;padding:28px 20px;color:var(--muted);font-size:13px;position:relative;z-index:1}

@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
.hidden{display:none!important}

@media(max-width:500px){
  .btn{padding:11px 14px;font-size:13px}
  .card{padding:18px}
  .option{padding:12px 14px}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="stars"></div>
  <div class="orb orb1"></div><div class="orb orb2"></div>
  <div class="orb orb3"></div><div class="orb orb4"></div>
</div>

<div class="page">
  <header>
    <h1>BrainBoost Explorer</h1>
    <p>Search anything · Learn it · Prove it &nbsp;·&nbsp; Built by Vrishab Varun</p>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <input id="topicInput" placeholder="Search any topic…" aria-label="Search topic">
      <button class="btn btn-primary" onclick="searchTopic()">Search</button>
      <button class="btn btn-ghost" onclick="randomTopic()">Random 🎲</button>
    </div>
    <div id="recentRow" class="recent"></div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Exploring the knowledge base…</p>
  </div>

  <div id="mainView">
    <div id="resultCard" class="card hidden">
      <div id="title" class="card-title"></div>
      <div id="image"></div>
      <div id="overview"></div>
      <div class="card-actions">
        <button id="quizBtn" class="btn btn-green" onclick="loadQuiz()">🧠 Quiz Me!</button>
        <button id="copyBtn" class="btn btn-ghost btn-sm" onclick="copyText()">Copy Summary</button>
        <a id="wikiLink" class="btn btn-ghost btn-sm" target="_blank" rel="noopener" style="text-decoration:none">Wikipedia ↗</a>
      </div>
    </div>

    <div id="relatedCard" class="card hidden">
      <div class="section-label">Related Topics</div>
      <div id="related"></div>
    </div>
  </div>

  <div id="quizLoading">
    <div class="spinner"></div>
    <p>Generating your quiz…</p>
  </div>

  <div id="quizView">
    <div class="card">
      <div class="quiz-header">
        <span class="quiz-label" id="quizTopic"></span>
        <span class="quiz-progress-text" id="quizProgress"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="question-label">Which statement is TRUE?</div>
      <p class="question-text" id="questionText" style="display:none"></p>
      <div class="options" id="optionsContainer"></div>
      <div class="next-wrap">
        <button class="btn btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
    <div style="margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="exitQuiz()">← Back to article</button>
    </div>
  </div>

  <div id="scoreView">
    <div class="card pop">
      <div class="score-hero">
        <span class="score-emoji" id="scoreEmoji"></span>
        <div class="score-number" id="scoreNum"></div>
        <div class="score-label" id="scoreOutOf"></div>
        <p class="score-message" id="scoreMsg"></p>
        <div class="score-actions">
          <button class="btn btn-primary" onclick="shareScore()">Share Result 🔗</button>
          <button class="btn btn-green" onclick="loadQuiz()">Try Again 🔄</button>
          <button class="btn btn-ghost" onclick="exitQuiz()">Back to Article</button>
        </div>
      </div>
      <div class="breakdown" id="breakdown"></div>
    </div>
  </div>
</div>

<footer>© 2026 Vrishab Varun · All rights reserved</footer>

<script>
/* STATE */
let fullText='', fullTitle='', wikiUrl='';
let relatedTitles=[];
let quizQuestions=[], currentQ=0, score=0, userAnswers=[];
let recent=[];
try{recent=JSON.parse(localStorage.getItem('bb_recent')||'[]')}catch(e){recent=[]}

/* UTILS */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function extractSentences(text,n=12){
  return (text.match(/[^.!?]+[.!?]+/g)||[])
    .map(s=>s.trim())
    .filter(s=>s.length>50&&s.length<240&&!/^\[/.test(s)&&!/^See also/.test(s))
    .slice(0,n);
}

function saveRecent(t){
  recent=[t,...recent.filter(x=>x!==t)].slice(0,8);
  try{localStorage.setItem('bb_recent',JSON.stringify(recent))}catch(e){}
  renderRecent();
}

function renderRecent(){
  const row=document.getElementById('recentRow');
  if(!recent.length){row.innerHTML='';return}
  row.innerHTML=recent.map(t=>
    `<button class="recent-chip" onclick="searchTopic('${t.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">⏱ ${t}</button>`
  ).join('');
}

/* VIEWS */
function showView(name){
  ['loading','mainView','quizLoading','quizView','scoreView'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.display=(id===name)?'block':'none';
  });
}

/* SEARCH */
document.getElementById('topicInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchTopic()});

async function searchTopic(topicOverride=null){
  const inputField=document.getElementById('topicInput');
  const input=(topicOverride||inputField.value).trim();
  if(!input)return;
  inputField.value=input;

  showView('loading');
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('relatedCard').classList.add('hidden');

  try{
    const sr=await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=${encodeURIComponent(input)}&srlimit=1`);
    const sd=await sr.json();

    if(!sd.query.search.length){
      showView('mainView');
      document.getElementById('title').innerText='No results found for "'+input+'"';
      document.getElementById('overview').innerText='';
      document.getElementById('image').innerHTML='';
      document.getElementById('resultCard').classList.remove('hidden');
      return;
    }

    const best=sd.query.search[0].title;

    const [sumRes,relRes]=await Promise.all([
      fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(best)}`),
      fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=${encodeURIComponent(input)}&srlimit=9`)
    ]);

    const s=await sumRes.json();
    const relData=await relRes.json();

    fullTitle=s.title;
    fullText=s.extract||'';
    wikiUrl=s.content_urls?.desktop?.page||'';
    relatedTitles=relData.query.search.filter(r=>r.title!==fullTitle).slice(0,7).map(r=>r.title);

    document.getElementById('title').innerText=fullTitle;
    document.getElementById('overview').innerText=fullText;
    document.getElementById('wikiLink').href=wikiUrl;

    /* IMAGE: use originalimage (full res) if available, else thumbnail */
    const imgSrc=s.originalimage?.source||s.thumbnail?.source||null;
    document.getElementById('image').innerHTML=imgSrc
      ?`<img src="${imgSrc}" alt="${s.title}" loading="lazy">`
      :'';

    const relDiv=document.getElementById('related');
    relDiv.innerHTML=relatedTitles.map(t=>
      `<button class="chip" onclick="searchTopic('${t.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">${t}</button>`
    ).join('');

    saveRecent(fullTitle);
    showView('mainView');
    document.getElementById('resultCard').classList.remove('hidden');
    if(relatedTitles.length) document.getElementById('relatedCard').classList.remove('hidden');
    document.getElementById('copyBtn').innerText='Copy Summary';
    document.getElementById('quizBtn').disabled=false;

  }catch(err){
    console.error(err);
    showView('mainView');
    document.getElementById('title').innerText='Connection error — please try again';
    document.getElementById('overview').innerText='';
    document.getElementById('image').innerHTML='';
    document.getElementById('resultCard').classList.remove('hidden');
  }
}

function randomTopic(){
  showView('loading');
  fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary')
    .then(r=>r.json()).then(d=>searchTopic(d.title))
    .catch(()=>showView('mainView'));
}

function copyText(){
  if(!fullText)return;
  navigator.clipboard.writeText(fullText).then(()=>{
    const b=document.getElementById('copyBtn');
    b.innerText='✓ Copied!';
    setTimeout(()=>{b.innerText='Copy Summary'},2200);
  });
}

/* QUIZ */
async function loadQuiz(){
  if(!fullText)return;
  showView('quizLoading');
  quizQuestions=[];currentQ=0;score=0;userAnswers=[];

  try{
    const picks=shuffle([...relatedTitles]).slice(0,3);
    const fetches=picks.map(t=>
      fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`)
        .then(r=>r.json()).catch(()=>null)
    );
    const related=await Promise.all(fetches);

    const distractorPool=[];
    related.filter(Boolean).forEach(r=>{
      if(r.extract) extractSentences(r.extract,6).forEach(s=>distractorPool.push(s));
    });
    shuffle(distractorPool);

    const mainSentences=shuffle(extractSentences(fullText,12));
    const numQ=Math.min(5,mainSentences.length,Math.floor(distractorPool.length/3));

    for(let i=0;i<numQ;i++){
      const correct=mainSentences[i];
      const wrong=distractorPool.slice(i*3,i*3+3);
      if(wrong.length<3)break;
      quizQuestions.push({correct,options:shuffle([correct,...wrong])});
    }

    if(quizQuestions.length<2){
      alert('Not enough content for a quiz on this topic. Try a longer article!');
      showView('mainView');
      document.getElementById('resultCard').classList.remove('hidden');
      if(relatedTitles.length) document.getElementById('relatedCard').classList.remove('hidden');
      return;
    }

    showView('quizView');
    document.getElementById('quizTopic').innerText=fullTitle;
    showQuestion(0);

  }catch(err){
    console.error(err);
    alert('Could not generate quiz. Please try again!');
    showView('mainView');
    document.getElementById('resultCard').classList.remove('hidden');
  }
}

function showQuestion(i){
  const q=quizQuestions[i];
  const total=quizQuestions.length;
  document.getElementById('quizProgress').innerText=`${i+1} / ${total}`;
  document.getElementById('progressFill').style.width=`${(i/total)*100}%`;
  document.getElementById('questionText').style.display='none';
  document.getElementById('questionText').innerText=q.correct;

  const letters=['A','B','C','D'];
  document.getElementById('optionsContainer').innerHTML=q.options.map((opt,idx)=>
    `<button class="option" onclick="answerQ(${idx})">
      <span class="option-letter">${letters[idx]}</span><span>${opt}</span>
    </button>`
  ).join('');
  document.getElementById('nextBtn').classList.add('hidden');
}

function answerQ(selectedIdx){
  const q=quizQuestions[currentQ];
  const correct=q.options.indexOf(q.correct);
  const isCorrect=selectedIdx===correct;
  if(isCorrect)score++;
  userAnswers.push({isCorrect,correctText:q.correct});

  document.querySelectorAll('.option').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===correct)btn.classList.add('correct');
    else if(i===selectedIdx)btn.classList.add('wrong');
  });

  document.getElementById('questionText').style.display='block';
  document.getElementById('progressFill').style.width=`${((currentQ+1)/quizQuestions.length)*100}%`;
  const nextBtn=document.getElementById('nextBtn');
  nextBtn.classList.remove('hidden');
  nextBtn.innerText=currentQ<quizQuestions.length-1?'Next →':'See Results 🏆';
}

function nextQuestion(){
  currentQ++;
  if(currentQ>=quizQuestions.length){showScore();return}
  showQuestion(currentQ);
}

function showScore(){
  const total=quizQuestions.length;
  const pct=score/total;
  const emojis=['😅','🤔','👍','🔥','🧠'];
  const msgs=[
    'Keep exploring — every expert started somewhere!',
    'Not bad! Read a bit more and try again.',
    'Solid! You clearly paid attention.',
    'Impressive knowledge! Really well done.',
    'Perfect score! You\'re a BrainBoost legend. 🏆'
  ];
  const tier=Math.min(4,Math.floor(pct*5));
  document.getElementById('scoreEmoji').innerText=emojis[tier];
  document.getElementById('scoreNum').innerText=`${score}/${total}`;
  document.getElementById('scoreOutOf').innerText=`on "${fullTitle}"`;
  document.getElementById('scoreMsg').innerText=msgs[tier];

  document.getElementById('breakdown').innerHTML=
    '<div class="section-label" style="margin-bottom:14px">Answer Breakdown</div>'+
    userAnswers.map((a,i)=>
      `<div class="breakdown-item">
        <span class="bi-icon">${a.isCorrect?'✅':'❌'}</span>
        <span class="bi-text">Q${i+1}: ${a.isCorrect?'Correct':'Incorrect'} — <em>${a.correctText.slice(0,100)}${a.correctText.length>100?'…':''}</em></span>
      </div>`
    ).join('');

  showView('scoreView');
}

function shareScore(){
  const text=`I scored ${score}/${quizQuestions.length} on "${fullTitle}" in BrainBoost Explorer! 🧠 Can you beat me?`;
  const url=window.location.href;
  if(navigator.share){
    navigator.share({title:'BrainBoost Explorer',text,url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(`${text}\n${url}`).then(()=>{
      alert('Copied to clipboard — go share it! 🔗');
    });
  }
}

function exitQuiz(){
  showView('mainView');
  document.getElementById('resultCard').classList.remove('hidden');
  if(relatedTitles.length) document.getElementById('relatedCard').classList.remove('hidden');
}

/* INIT */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
renderRecent();
</script>
</body>
</html>
